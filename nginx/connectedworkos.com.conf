# Public marketing site — reference copy of
# /etc/nginx/sites-available/connectedworkos.com on the Hostinger VPS (2.25.186.172).
#
# !! THIS FILE INCLUDES THE CERTBOT-MANAGED TLS BLOCK. KEEP IT THAT WAY. !!
#
# On 2026-08-15 the reference here held only the port-80 block, because it was written
# before certbot ran. Pushing it over the live file to change a single gzip line silently
# deleted the 443 server block — HTTPS on connectedworkos.com then fell through to another
# vhost, served the wrong certificate, and Google Search Console reported
# "Page fetch: Failed: Robots.txt unreachable" within minutes of the reload. `nginx -t`
# passes cheerfully, because a vhost with no TLS block is valid config.
#
# If you need to change this: pull the LIVE copy first, edit that, push it back. Never
# hand-write a replacement.
#   ssh root@2.25.186.172 'cat /etc/nginx/sites-available/connectedworkos.com'
# Recovery if it happens again:
#   certbot --nginx -d connectedworkos.com -d www.connectedworkos.com --reinstall --redirect
#
# Static only. It serves marketing/ straight out of the app's git checkout, so a deploy
# is just `git pull` — there is no PM2 process behind this and nothing to restart. The
# app itself lives on app.connectedworkos.com and is a completely separate vhost, so a
# mistake here cannot take the product down.
#
# Ledger shares this nginx — ALWAYS `nginx -t` before reloading.
#
# TLS lines are added by:
#   certbot --nginx -d connectedworkos.com -d www.connectedworkos.com

server {
    server_name connectedworkos.com www.connectedworkos.com;

    root /var/www/cho-hub/marketing;
    index index.html;

    # The app is a different host entirely; nothing here should ever proxy to it.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprint-free filenames, so keep the HTML revalidating or a copy change would
    # sit stale in browsers. The image is safe to cache hard.
    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location ~* \.css$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    # text/html is always gzipped by nginx and listing it again only earns a
    # "duplicate MIME type" warning on reload.
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/connectedworkos.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/connectedworkos.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.connectedworkos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = connectedworkos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name connectedworkos.com www.connectedworkos.com;
    return 404; # managed by Certbot




}