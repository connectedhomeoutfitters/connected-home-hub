# Synology NAS nginx config for CHO Hub — TEST hosting only (masinet.synology.me),
# separate from actual production (hub.connectedhomeoutfitters.com, on the VPS).
# Mirrors N:\gymrProject\nginx\www.gymr.conf.
#
# Place this file at: /etc/nginx/conf.d/www.chohub.conf
# Then run: nginx -t && nginx -s reload
#
# The ^~ modifier ensures this prefix match beats Web Station's catch-all regex location ~ ^
#
# Port 3001 is a guess (gymr already occupies 3000 on this NAS) — verify nothing else
# is bound to 3001 before using it (e.g. `netstat -tlnp | grep 3001` on the NAS).

location ^~ /choHubProject {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}
