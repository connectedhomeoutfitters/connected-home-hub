# Production vhost for CHO Hub — reference copy of
# /etc/nginx/sites-available/app.connectedworkos.com on the Hostinger VPS (2.25.186.172).
#
# This is the PRODUCT domain. hub.connectedhomeoutfitters.com is the retired original
# host and now 301s here (see hub.connectedhomeoutfitters.com.conf in this folder) —
# Hub is multi-tenant, and a competing contractor will not sign in on a rival
# contractor's domain.
#
# The TLS lines are added by `certbot --nginx -d app.connectedworkos.com`; this file is
# what exists immediately before that runs. Ledger (connectedhomeledger.com) shares this
# nginx — ALWAYS `nginx -t` before reloading.

server {
    listen 80;
    listen [::]:80;
    server_name app.connectedworkos.com;

    # Consultation photos + subcontractor documents can be several MB.
    client_max_body_size 25M;

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
