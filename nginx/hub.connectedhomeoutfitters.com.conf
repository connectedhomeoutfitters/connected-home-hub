# Retired original Hub host — reference copy of
# /etc/nginx/sites-available/hub.connectedhomeoutfitters.com on the VPS.
#
# The app moved to app.connectedworkos.com (2026-08-14). This host is kept alive purely
# as a permanent redirect: old emailed estimate/invoice links, customer and
# subcontractor magic links, and bookmarks all still point here and must keep working.
#
# Keep its certbot cert renewing — the 80->443 hop means an expired cert would break the
# redirect for anyone who follows an old https link. Do NOT delete this vhost.

server {
    server_name hub.connectedhomeoutfitters.com;

    # $request_uri preserves BOTH path and query string, which matters: magic-link and
    # access-token URLs carry their token in the path (/e/:token, /i/:token), and Stripe
    # bounces back to /i/:token/next-steps with query params.
    location / {
        return 301 https://app.connectedworkos.com$request_uri;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hub.connectedhomeoutfitters.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hub.connectedhomeoutfitters.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = hub.connectedhomeoutfitters.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name hub.connectedhomeoutfitters.com;
    return 404; # managed by Certbot
}
